openapi: 3.1.0

info:
  title: MoR Ledger API
  version: 0.1.0
  description: |
    ~(=^・ω・^)ﾉ        Merchant of Record ledger

    Records captured payments and refunds,
    derives tax liabilities and merchant balances from an append-only ledger.

servers:
  - url: http://localhost:8081
    description: local

paths:
  /v1/payment/capture:
    post:
      summary: PSP reports a payment
      description: |
        Money is already taken from the customer by the PSP.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './definitions.yaml#/components/schemas/PaymentRequest'
            example:
              pspReference: '8835116497253962'
              merchantId: 5f1d9e02-3ab7-4c88-b0e5-6d427fa1c93b
              amount: 11900
              currency: EUR
              billingAddress:
                country: DE
                postalCode: '10115'
              cardIssuingCountry: DE
              ipCountry: DE
              paymentTime: 2026-09-23T10:15:30Z
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: SUCCESS
        '4XX':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: FAILED
                reason: INVALID_REQUEST

  /v1/payment/refund:
    post:
      summary: PSP reports a refund
      description: |
        The money has already left: approval happened earlier, in the refund
        service, and the PSP has paid the customer back. The ledger records the
        refund and never declines it.
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './definitions.yaml#/components/schemas/RefundRequest'
            example:
              refundReference: '9915116497253970'
              pspReference: '8835116497253962'
              amount: 5000
              currency: EUR
              success: true
              reason: CUSTOMER_REQUEST
              refundedAt: 2026-09-25T09:30:00Z
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: SUCCESS
        '4XX':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: FAILED
                reason: INVALID_REQUEST
