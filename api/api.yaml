openapi: 3.1.0

info:
  title: MoR Ledger API
  version: 0.1.0
  description: |
    ~(=^・ω・^)ﾉ        Merchant of Record ledger

    Records captured payments and refunds,
    derives tax liabilities and merchant balances from an append-only ledger.

servers:
  - url: http://localhost:8081
    description: local

paths:
  /v1/payment/capture:
    post:
      tags: [ Tap to pay ]
      summary: PSP reports a payment
      description: |
        Money is already taken from the customer by the PSP. The Mor save them.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './definitions.yaml#/components/schemas/PaymentRequest'
            example:
              pspReference: '8835116497253962'
              merchantId: 1a1e7d6c-0000-4000-8000-000000000001
              amount: 119.00
              currency: EUR
              success: true
              billingAddress:
                country: DE
                postalCode: '10115'
              cardIssuingCountry: DE
              ipCountry: DE
              paymentTime: 2026-09-23T10:15:30Z
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: SUCCESS
        '4XX':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: FAILED
                reason: INVALID_REQUEST
        '500':
          description: Internal failure. Nothing was recorded; the sender should retry.

  /v1/payment/refund:
    post:
      tags: [ Tap to refund ]
      summary: PSP reports a refund
      description: |
        The ledger records the refund and never declines it.
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './definitions.yaml#/components/schemas/RefundRequest'
            example:
              refundReference: '9915116497253970'
              pspReference: '8835116497253962'
              amount: 50.00
              currency: EUR
              success: true
              reason: CUSTOMER_REQUEST
              refundedAt: 2026-09-25T09:30:00Z
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: SUCCESS
        '4XX':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: FAILED
                reason: INVALID_REQUEST
        '500':
          description: Internal failure. Nothing was recorded; the sender should retry.

  /v1/balances/tax:
    get:
      tags: [ Tap to look at the balances ]
      summary: What one country's tax authority is owed
      description: |
        Sums the country's TAX account in the ledger.

        Without `from` and `to` it answers "what do we owe right now".
        With them it answers a filing period: the balance at the start, the movement
        inside the window, and the balance at the end. 

        One country per call.
      operationId: taxBalance
      security: [ ]
      parameters:
        - name: country
          in: query
          required: true
          schema:
            $ref: './definitions.yaml#/components/schemas/Country'
          example: DE
        - name: from
          in: query
          required: false
          description: Start of the window, inclusive. Omit for the balance now.
          schema:
            type: string
            format: date-time
          example: '2026-09-01T00:00:00Z'
        - name: to
          in: query
          required: false
          description: End of the window, exclusive. Defaults to now.
          schema:
            type: string
            format: date-time
          example: '2026-10-01T00:00:00Z'
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/TaxBalance'
              example:
                country: DE
                currency: EUR
                from: '2026-09-01T00:00:00Z'
                to: '2026-10-01T00:00:00Z'
                owedAtStart: '0.00'
                movement: '21.00'
                owedAtEnd: '21.00'
        '400':
          description: Missing or malformed country or dates
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: FAILED
                reason: INVALID_REQUEST

  /v1/balances/merchants:
    get:
      tags: [ balances ]
      summary: What merchants are owed
      description: |
        Current balance per merchant: `available` is payable on the next payout
        run (until that - nothing). 
        
        The job for calculating merchant balance run each day, but you can call `/v1/payouts/compute` 
        to process them imitatively

        Add correct `merchantId` to see the data. Repeat `merchantId` to ask for several, at most 100 per call.

        Without `date` the answer is the live balance summed from the ledger up
        to `asOf` (default now). 
        With `date` it is that day's close, read from the nightly snapsho.
      operationId: merchantBalances
      security: [ ]
      parameters:
        - name: merchantId
          in: query
          required: false
          description: Repeat for several merchants, at most 100. Omit to page through all.
          schema:
            type: array
            items:
              $ref: './definitions.yaml#/components/schemas/Id'
          style: form
          explode: true
        - name: date
          in: query
          required: false
          description: Business day to read from the nightly snapshot. Omit for the live balance.
          schema:
            type: string
            format: date
          example: '2026-09-25'
        - name: asOf
          in: query
          required: false
          description: |
            Cutoff for the live balance. Defaults to now. Pass the value echoed
            in the response to keep every page of a walk on one instant.
          schema:
            type: string
            format: date-time
          example: '2026-09-26T18:12:00Z'
        - name: after
          in: query
          required: false
          description: Last merchant id of the previous page. Omit for the first page.
          schema:
            $ref: './definitions.yaml#/components/schemas/Id'
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/MerchantBalances'
              example:
                currency: EUR
                date: null
                asOf: '2026-09-26T18:12:00Z'
                limit: 100
                nextCursor: null
                merchants:
                  - merchantId: 1a1e7d6c-0000-4000-8000-000000000001
                    merchantName: Memniy korol inc.
                    available: '95.00'
                    held: '0.00'
        '400':
          description: Malformed merchant id, date, asOf or cursor; more than 100 merchant ids; limit out of range
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/LedgerResponse'
              example:
                status: FAILED
                reason: INVALID_REQUEST

components:
  securitySchemes:
    PspSignature:
      description: |
        Hex HMAC-SHA256 of the raw request body, using the PSP shared secret.
      type: apiKey
      in: header
      name: X-Psp-Signature

security:
  - PspSignature: [ ]
