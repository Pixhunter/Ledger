openapi: 3.1.0

info:
  title: MoR Ledger API
  version: 0.1.0
  description: |
    ~(=^・ω・^)ﾉ        Merchant of Record ledger

    Records captured payments and refunds,
    derives tax liabilities and merchant balances from an append-only ledger.

servers:
  - url: http://localhost:8081
    description: local

paths:
  /v1/payments/capture:
    post:
      summary: PSP reports a captured payment
      description: |
        Money is already taken from the customer by the PSP.
        PSP sends customer location, not tax. Digital goods only.
        Ledger derives tax from the customer's residence, never the merchant's:
          - tax country = country backed by at least 2 of
            billingAddress.country, cardIssuingCountry, ipCountry;
            on conflict billing country wins and the conflict is logged
          - customerVatId present and country != MoR country -> B2B reverse charge, 0% tax
          - otherwise B2C at the standard rate of the tax country
        Idempotent on pspReference: a retry returns the original answer.
      operationId: capturePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './definitions.yaml#/components/schemas/PaymentRequest'
            example:
              pspReference: '8835116497253962'
              merchantId: 5f1d9e02-3ab7-4c88-b0e5-6d427fa1c93b
              amount: 11900
              currency: EUR
              billingAddress:
                country: DE
                postalCode: '10115'
              cardIssuingCountry: DE
              ipCountry: DE
              capturedAt: 2026-09-23T10:15:30Z
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/PaymentResponse'
              example:
                status: SUCCESS
        '4XX':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: './definitions.yaml#/components/schemas/PaymentResponse'
              example:
                status: FAILED
                reason: UNSUPPORTED_TAX_COUNTRY