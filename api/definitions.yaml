components:
  schemas:
    PaymentRequest:
      type: object
      additionalProperties: false
      required:
        - pspReference
        - merchantId
        - amount
        - currency
        - cardIssuingCountry
        - paymentTime
      properties:
        pspReference:
          description: PSP payment id. Idempotency key. Not a UUID.
          $ref: '#/components/schemas/IdempotencyToken'
        merchantId:
          description: Our merchant, set by our checkout in PSP metadata and echoed back.
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        billingAddress:
          $ref: '#/components/schemas/BillingAddress'
        cardIssuingCountry:
          description: From card BIN. Always known to the PSP. Tax evidence.
          $ref: '#/components/schemas/Country'
        ipCountry:
          description: Customer IP country at checkout, passed via PSP metadata. Tax evidence, tie-breaker.
          $ref: '#/components/schemas/Country'
        customerVatId:
          description: Buyer VAT id, passed via PSP metadata. Present = business customer (reverse charge).
          type: string
          pattern: '^[A-Z]{2}[A-Za-z0-9]{2,13}$'
        paymentTime:
          type: string
          format: date-time

    PaymentResponse:
      type: object
      required: [ status ]
      properties:
        status:
          $ref: '#/components/schemas/Status'
        reason:
          description: Only when FAILED.
          $ref: '#/components/schemas/ErrorReason'

    Status:
      description: State machine result
      type: string
      enum: [ SUCCESS, FAILED ]
      examples: [ SUCCESS ]

    ErrorReason:
      description: State machine result
      type: string
      enum:
        - INVALID_REQUEST
        - UNKNOWN_MERCHANT
        - DUPLICATE_CONFLICT
        - AMOUNT_BELOW_FEE
        - UNSUPPORTED_TAX_COUNTRY
        - INSUFFICIENT_TAX_EVIDENCE
      examples: [ INVALID_REQUEST ]

    Currency:
      description: Currency in alphabetic format (ISO 4217)
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [ EUR ]

    Amount:
      description: Money amount
      type: integer
      format: int64
      minimum: 1
      examples: [ 10000 ]

    BillingAddress:
      description: Customer billing address as collected by PSP. Tax evidence, wins on conflict.
      type: object
      additionalProperties: false
      required: [ country ]
      properties:
        country:
          $ref: '#/components/schemas/Country'
        stateOrProvince:
          description: Needed only for US / CA.
          type: string
        postalCode:
          type: string

    Country:
      description: ISO 3166-1 alpha-2.
      type: string
      pattern: '^[A-Z]{2}$'

    Id:
      type: string
      format: uuid

    IdempotencyToken:
      type: string
      minLength: 10
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'