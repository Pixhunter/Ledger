components:
  schemas:
    PaymentRequest:
      type: object
      required:
        - pspReference
        - merchantId
        - amount
        - currency
        - success
        - cardIssuingCountry
        - paymentTime
      properties:
        pspReference:
          description: PSP payment id. Idempotency key. Not a UUID.
          $ref: '#/components/schemas/IdempotencyToken'
        merchantId:
          description: Our merchant, set by our checkout in PSP metadata and echoed back.
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        success:
          description: false = the payment did not happen at the PSP. Acknowledged, not stored.
          type: boolean
        billingAddress:
          $ref: '#/components/schemas/BillingAddress'
        cardIssuingCountry:
          description: From card BIN. Always known to the PSP. Tax evidence.
          $ref: '#/components/schemas/Country'
        ipCountry:
          description: Customer IP country at checkout, passed via PSP metadata. Tax evidence, tie-breaker.
          $ref: '#/components/schemas/Country'
        customerVatId:
          description: Buyer VAT id, passed via PSP metadata. Present = business customer (reverse charge).
          type: string
          pattern: '^[A-Z]{2}[A-Za-z0-9]{2,13}$'
        paymentTime:
          type: string
          format: date-time

    LedgerResponse:
      description: |
        The answer to every money event the ledger records. 
        Two outcomes only: the event is recorded, or the request was broken and nothing was written.
      type: object
      required: [ status ]
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        reason:
          description: Only when FAILED.
          $ref: '#/components/schemas/ErrorReason'

    ResponseStatus:
      type: string
      enum: [ SUCCESS, FAILED ]
      examples: [ SUCCESS ]

    ErrorReason:
      description: |
        Why nothing was recorded. Only a broken request fails.
      type: string
      enum:
        - INVALID_REQUEST
      examples: [ INVALID_REQUEST ]

    RefundRequest:
      description: |
        The PSP has already returned the money to the customer. 
        This is a notification
      type: object
      required:
        - refundReference
        - pspReference
        - amount
        - currency
        - success
        - refundedAt
      properties:
        refundReference:
          description: The refund's own PSP id, new for every refund. Idempotency key.
          $ref: '#/components/schemas/IdempotencyToken'
        pspReference:
          description: The original payment's PSP id. Lookup key.
          $ref: '#/components/schemas/IdempotencyToken'
        amount:
          description: Refunded amount, at most what is left to refund on the payment.
          $ref: '#/components/schemas/Amount'
        currency:
          description: Must equal the payment's currency.
          $ref: '#/components/schemas/Currency'
        success:
          description: false means the refund failed at the PSP. Nothing is recorded.
          type: boolean
        reason:
          $ref: '#/components/schemas/RefundReason'
        refundedAt:
          description: |
            When the PSP refunded. Decides the period the tax is reduced in, so
            it must be at or after the capture's `paymentTime` and no more than
            2 days ahead of now. Outside that window the refund is queued for
            review as `INVALID_DATE` and nothing is booked.
          type: string
          format: date-time

    RefundReason:
      type: string
      enum:
        - DUPLICATE
        - FRAUD
        - CUSTOMER_REQUEST
        - PRODUCT_ISSUE
        - OTHER
      examples: [ CUSTOMER_REQUEST ]

    TaxBalance:
      description: |
        What one country's tax authority is owed. Amounts are decimal strings
        in the ledger currency, never floats.
      type: object
      required: [ country, currency, to, owedAtStart, movement, owedAtEnd ]
      properties:
        country:
          $ref: '#/components/schemas/Country'
        currency:
          $ref: '#/components/schemas/Currency'
        from:
          description: Absent when the answer is the balance now.
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        owedAtStart:
          description: Owed immediately before the window. Zero when there is no window.
          type: string
        movement:
          description: Change inside the window - sales add, refunds and remittances subtract.
          type: string
        owedAtEnd:
          description: Owed at the end of the window. This is the number a return is filed for.
          type: string

    MerchantBalances:
      type: object
      required: [ currency, asOf, limit, merchants ]
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        date:
          description: The day read from the snapshot, or null for the live balance.
          type: string
          format: date
        asOf:
          description: Cutoff the live balance was summed to.
          type: string
          format: date-time
        limit:
          description: Page size actually applied.
          type: integer
        nextCursor:
          description: |
            Pass back as `after` to fetch the next page. Null on the last page.
          type: string
          format: uuid
          nullable: true
        merchants:
          type: array
          items:
            $ref: '#/components/schemas/MerchantBalance'

    MerchantBalance:
      type: object
      required: [ merchantId, merchantName, available, held ]
      properties:
        merchantId:
          $ref: '#/components/schemas/Id'
        merchantName:
          type: string
        available:
          description: Payable on the next payout run.
          type: string
        held:
          description: |
            Recorded but frozen, never paid out until released. Absent for a
            past date: the nightly snapshot records the merchant balance only.
          type: string

    Currency:
      description: ISO 4217. EUR only for now; more once the MoR settles in them.
      type: string
      enum:
        - EUR
      examples: [ EUR ]

    Amount:
      description: Money in major currency units. EUR accepts at most two decimal places.
      type: number
      format: decimal
      minimum: 0.01
      maximum: 999999999999999.99
      multipleOf: 0.01
      examples: [ 100.00 ]

    BillingAddress:
      description: Customer billing address as collected by PSP. Tax evidence, wins on conflict.
      type: object
      required: [ country ]
      properties:
        country:
          $ref: '#/components/schemas/Country'
        stateOrProvince:
          description: Needed only for US / CA.
          type: string
        postalCode:
          type: string

    Country:
      description: ISO 3166-1 alpha-2.
      type: string
      pattern: '^[A-Z]{2}$'

    Id:
      type: string
      format: uuid

    IdempotencyToken:
      type: string
      minLength: 10
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
