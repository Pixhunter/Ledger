components:
  schemas:
    PaymentRequest:
      type: object
      required:
        - pspReference
        - merchantId
        - amount
        - currency
        - cardIssuingCountry
        - paymentTime
      properties:
        pspReference:
          description: PSP payment id. Idempotency key. Not a UUID.
          $ref: '#/components/schemas/IdempotencyToken'
        merchantId:
          description: Our merchant, set by our checkout in PSP metadata and echoed back.
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        billingAddress:
          $ref: '#/components/schemas/BillingAddress'
        cardIssuingCountry:
          description: From card BIN. Always known to the PSP. Tax evidence.
          $ref: '#/components/schemas/Country'
        ipCountry:
          description: Customer IP country at checkout, passed via PSP metadata. Tax evidence, tie-breaker.
          $ref: '#/components/schemas/Country'
        customerVatId:
          description: Buyer VAT id, passed via PSP metadata. Present = business customer (reverse charge).
          type: string
          pattern: '^[A-Z]{2}[A-Za-z0-9]{2,13}$'
        paymentTime:
          type: string
          format: date-time

    LedgerResponse:
      description: |
        The answer to every money event the ledger records. 
        Two outcomes only: the event is recorded, or the request was broken and nothing was written.
      type: object
      required: [ status ]
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        reason:
          description: Only when FAILED.
          $ref: '#/components/schemas/ErrorReason'

    ResponseStatus:
      type: string
      enum: [ SUCCESS, FAILED ]
      examples: [ SUCCESS ]

    ErrorReason:
      description: |
        Why nothing was recorded. Only a broken request fails.
      type: string
      enum:
        - INVALID_REQUEST
      examples: [ INVALID_REQUEST ]

    RefundRequest:
      description: |
        The PSP has already returned the money to the customer. 
        This is a notification
      type: object
      required:
        - refundReference
        - pspReference
        - amount
        - currency
        - success
        - refundedAt
      properties:
        refundReference:
          description: The refund's own PSP id, new for every refund. Idempotency key.
          $ref: '#/components/schemas/IdempotencyToken'
        pspReference:
          description: The original payment's PSP id. Lookup key.
          $ref: '#/components/schemas/IdempotencyToken'
        amount:
          description: Refunded amount, at most what is left to refund on the payment.
          $ref: '#/components/schemas/Amount'
        currency:
          description: Must equal the payment's currency.
          $ref: '#/components/schemas/Currency'
        success:
          description: false means the refund failed at the PSP. Nothing is recorded.
          type: boolean
        reason:
          $ref: '#/components/schemas/RefundReason'
        refundedAt:
          description: When the PSP refunded. Decides the period the tax is reduced in.
          type: string
          format: date-time

    RefundReason:
      type: string
      enum:
        - DUPLICATE
        - FRAUD
        - CUSTOMER_REQUEST
        - PRODUCT_ISSUE
        - OTHER
      examples: [ CUSTOMER_REQUEST ]

    Currency:
      description: ISO 4217. EUR only for now; more once the MoR settles in them.
      type: string
      enum:
        - EUR
      examples: [ EUR ]

    Amount:
      description: Money in major currency units. EUR accepts at most two decimal places.
      type: number
      format: decimal
      minimum: 0.01
      maximum: 999999999999999.99
      multipleOf: 0.01
      examples: [ 100.00 ]

    BillingAddress:
      description: Customer billing address as collected by PSP. Tax evidence, wins on conflict.
      type: object
      required: [ country ]
      properties:
        country:
          $ref: '#/components/schemas/Country'
        stateOrProvince:
          description: Needed only for US / CA.
          type: string
        postalCode:
          type: string

    Country:
      description: ISO 3166-1 alpha-2.
      type: string
      pattern: '^[A-Z]{2}$'

    Id:
      type: string
      format: uuid

    IdempotencyToken:
      type: string
      minLength: 10
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
