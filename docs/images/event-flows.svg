<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Payment and refund event flows</title>
  <desc id="desc">PSP notifications enter the ledger, are stored idempotently, and either post, hold, wait, or enter manual review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5965"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17212b" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #17212b; }
      .lane { font: 700 18px Inter, Arial, sans-serif; fill: #17212b; }
      .boxTitle { font: 700 16px Inter, Arial, sans-serif; fill: #17212b; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #33404d; }
      .small { font: 13px Inter, Arial, sans-serif; fill: #526171; }
      .arrow { stroke: #4f5965; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="690" fill="#fbfaf7"/>
  <text x="50" y="52" class="title">Money facts are durable; business problems stay visible</text>

  <rect x="36" y="88" width="1128" height="172" rx="18" fill="#eef6ff" stroke="#b8d8f4"/>
  <text x="58" y="120" class="lane">PAYMENT CAPTURE</text>
  <rect x="58" y="143" width="180" height="78" rx="12" fill="#ffffff" stroke="#7eb4df" filter="url(#shadow)"/>
  <text x="148" y="173" text-anchor="middle" class="boxTitle">PSP notification</text>
  <text x="148" y="198" text-anchor="middle" class="small">money already captured</text>
  <path d="M238 182 H292" class="arrow"/>
  <rect x="294" y="143" width="194" height="78" rx="12" fill="#ffffff" stroke="#7eb4df" filter="url(#shadow)"/>
  <text x="391" y="173" text-anchor="middle" class="boxTitle">Authenticate + parse</text>
  <text x="391" y="198" text-anchor="middle" class="small">bad envelope: 400 / 401</text>
  <path d="M488 182 H542" class="arrow"/>
  <rect x="544" y="143" width="190" height="78" rx="12" fill="#ffffff" stroke="#7eb4df" filter="url(#shadow)"/>
  <text x="639" y="173" text-anchor="middle" class="boxTitle">Idempotent insert</text>
  <text x="639" y="198" text-anchor="middle" class="small">same reference: no replay</text>
  <path d="M734 182 H788" class="arrow"/>
  <rect x="790" y="128" width="170" height="108" rx="12" fill="#e7f7ee" stroke="#62ad7f" filter="url(#shadow)"/>
  <text x="875" y="162" text-anchor="middle" class="boxTitle">POSTED</text>
  <text x="875" y="187" text-anchor="middle" class="small">tax + revenue</text>
  <text x="875" y="207" text-anchor="middle" class="small">+ merchant entries</text>
  <rect x="980" y="128" width="160" height="108" rx="12" fill="#fff5db" stroke="#d7a93f" filter="url(#shadow)"/>
  <text x="1060" y="162" text-anchor="middle" class="boxTitle">HELD</text>
  <text x="1060" y="187" text-anchor="middle" class="small">unknown merchant</text>
  <text x="1060" y="207" text-anchor="middle" class="small">or unresolved tax</text>
  <path d="M734 182 C770 182 760 182 788 182" class="arrow"/>
  <path d="M734 182 C790 182 820 106 978 151" class="arrow"/>

  <rect x="36" y="280" width="1128" height="194" rx="18" fill="#f1f7ef" stroke="#bfdbb9"/>
  <text x="58" y="314" class="lane">REFUND NOTIFICATION</text>
  <rect x="58" y="340" width="180" height="86" rx="12" fill="#ffffff" stroke="#8fbd84" filter="url(#shadow)"/>
  <text x="148" y="371" text-anchor="middle" class="boxTitle">PSP refund</text>
  <text x="148" y="395" text-anchor="middle" class="small">full or partial</text>
  <path d="M238 383 H292" class="arrow"/>
  <rect x="294" y="340" width="194" height="86" rx="12" fill="#ffffff" stroke="#8fbd84" filter="url(#shadow)"/>
  <text x="391" y="371" text-anchor="middle" class="boxTitle">Find payment</text>
  <text x="391" y="395" text-anchor="middle" class="small">missing: 404 + retry</text>
  <path d="M488 383 H542" class="arrow"/>
  <rect x="544" y="340" width="190" height="86" rx="12" fill="#ffffff" stroke="#8fbd84" filter="url(#shadow)"/>
  <text x="639" y="371" text-anchor="middle" class="boxTitle">Lock payment row</text>
  <text x="639" y="395" text-anchor="middle" class="small">serialize its refunds</text>
  <path d="M734 383 H788" class="arrow"/>
  <rect x="790" y="326" width="170" height="114" rx="12" fill="#e7f7ee" stroke="#62ad7f" filter="url(#shadow)"/>
  <text x="875" y="358" text-anchor="middle" class="boxTitle">Allocate</text>
  <text x="875" y="383" text-anchor="middle" class="small">cumulative tax</text>
  <text x="875" y="403" text-anchor="middle" class="small">revenue policy</text>
  <text x="875" y="423" text-anchor="middle" class="small">merchant remainder</text>
  <path d="M960 383 H1000" class="arrow"/>
  <rect x="1002" y="340" width="138" height="86" rx="12" fill="#ffffff" stroke="#8fbd84" filter="url(#shadow)"/>
  <text x="1071" y="371" text-anchor="middle" class="boxTitle">Commit</text>
  <text x="1071" y="395" text-anchor="middle" class="small">then return 200</text>

  <rect x="36" y="494" width="1128" height="152" rx="18" fill="#fff1f0" stroke="#efbbb5"/>
  <text x="58" y="528" class="lane">ANOMALY — NEVER SILENTLY DROP A MONEY FACT</text>
  <rect x="58" y="552" width="276" height="64" rx="12" fill="#ffffff" stroke="#d98278"/>
  <text x="196" y="579" text-anchor="middle" class="boxTitle">Duplicate reference conflict</text>
  <text x="196" y="601" text-anchor="middle" class="small">same key, different money data</text>
  <rect x="366" y="552" width="230" height="64" rx="12" fill="#ffffff" stroke="#d98278"/>
  <text x="481" y="579" text-anchor="middle" class="boxTitle">Over-refund</text>
  <text x="481" y="601" text-anchor="middle" class="small">refund total exceeds capture</text>
  <rect x="628" y="552" width="230" height="64" rx="12" fill="#ffffff" stroke="#d98278"/>
  <text x="743" y="579" text-anchor="middle" class="boxTitle">Unsupported fact</text>
  <text x="743" y="601" text-anchor="middle" class="small">currency, time or invariant</text>
  <path d="M858 584 H902" class="arrow"/>
  <rect x="904" y="540" width="236" height="88" rx="12" fill="#ffe1dd" stroke="#c86055" filter="url(#shadow)"/>
  <text x="1022" y="570" text-anchor="middle" class="boxTitle">Exception queue</text>
  <text x="1022" y="594" text-anchor="middle" class="small">raw payload + alert + review</text>
  <text x="1022" y="614" text-anchor="middle" class="small">correction is a new transaction</text>

  <text x="600" y="673" text-anchor="middle" class="small">Green: normal posting · Amber: recorded but frozen · Red: durable manual workflow (planned)</text>
</svg>
