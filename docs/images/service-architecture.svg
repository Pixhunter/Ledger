<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Ledger service architecture and balance flow</title>
  <desc id="desc">Customer PSP payment and refund events enter the ledger. Merchant and future tax services provide reference data. Daily balance calculation selects eligible unsettled entries, groups balances, creates payouts, and sends them through the merchant PSP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#536170"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17212b" flood-opacity="0.13"/>
    </filter>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#17212b}.head{font:700 16px Inter,Arial,sans-serif;fill:#17212b}.text{font:14px Inter,Arial,sans-serif;fill:#33404d}.small{font:13px Inter,Arial,sans-serif;fill:#526171}.tag{font:700 12px Inter,Arial,sans-serif;fill:#fff}.line{stroke:#536170;stroke-width:2;fill:none;marker-end:url(#arrow)}.future{stroke:#7d8994;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#fbfaf7"/>
  <text x="45" y="48" class="title">Services, ledger, and daily balance processing</text>

  <rect x="45" y="85" width="210" height="92" rx="14" fill="#eaf3ff" stroke="#79aee0" filter="url(#shadow)"/>
  <text x="150" y="119" text-anchor="middle" class="head">Customer PSP</text>
  <text x="150" y="144" text-anchor="middle" class="small">payments + refunds</text>

  <rect x="45" y="220" width="210" height="112" rx="14" fill="#eef8f1" stroke="#82b793" filter="url(#shadow)"/>
  <text x="150" y="254" text-anchor="middle" class="head">Merchant service</text>
  <text x="150" y="279" text-anchor="middle" class="small">profile · status · fee</text>
  <text x="150" y="301" text-anchor="middle" class="small">tax category · payout details</text>

  <rect x="45" y="375" width="210" height="112" rx="14" fill="#f1eafe" stroke="#a286d9" filter="url(#shadow)"/>
  <rect x="64" y="392" width="58" height="22" rx="11" fill="#8268bd"/><text x="93" y="408" text-anchor="middle" class="tag">FUTURE</text>
  <text x="150" y="442" text-anchor="middle" class="head">Tax service</text>
  <text x="150" y="466" text-anchor="middle" class="small">rates · VAT formats · laws</text>

  <rect x="45" y="535" width="210" height="92" rx="14" fill="#fff5db" stroke="#d7a93f" filter="url(#shadow)"/>
  <text x="150" y="569" text-anchor="middle" class="head">Operations manager</text>
  <text x="150" y="594" text-anchor="middle" class="small">manual updates + review</text>

  <rect x="340" y="75" width="675" height="565" rx="20" fill="#ffffff" stroke="#7d8994" stroke-width="2"/>
  <text x="370" y="111" class="head">Ledger service</text>

  <rect x="375" y="140" width="250" height="100" rx="14" fill="#eaf3ff" stroke="#79aee0"/>
  <text x="500" y="176" text-anchor="middle" class="head">Payment / refund API</text>
  <text x="500" y="201" text-anchor="middle" class="small">verify · deduplicate · calculate</text>
  <text x="500" y="222" text-anchor="middle" class="small">hold or post atomically</text>

  <rect x="705" y="140" width="275" height="100" rx="14" fill="#fff0ee" stroke="#df8b82"/>
  <text x="842" y="176" text-anchor="middle" class="head">Review queue</text>
  <text x="842" y="201" text-anchor="middle" class="small">holds · invalid data · alerts</text>
  <text x="842" y="222" text-anchor="middle" class="small">manual correction or release</text>

  <ellipse cx="677" cy="332" rx="205" ry="62" fill="#f5f6f7" stroke="#7d8994" filter="url(#shadow)"/>
  <text x="677" y="318" text-anchor="middle" class="head">Ledger database</text>
  <text x="677" y="343" text-anchor="middle" class="small">payments · refunds · entries · errors</text>
  <text x="677" y="365" text-anchor="middle" class="small">payouts · settlement links · daily snapshots</text>

  <rect x="375" y="445" width="605" height="158" rx="16" fill="#eef8f1" stroke="#82b793"/>
  <rect x="394" y="462" width="62" height="22" rx="11" fill="#4c9766"/><text x="425" y="478" text-anchor="middle" class="tag">DAILY</text>
  <text x="480" y="478" class="head">Balance stage</text>
  <rect x="395" y="505" width="125" height="66" rx="11" fill="#fff" stroke="#82b793"/>
  <text x="457" y="531" text-anchor="middle" class="small">1. Fix one</text><text x="457" y="552" text-anchor="middle" class="small">DB cutoff</text>
  <rect x="542" y="505" width="125" height="66" rx="11" fill="#fff" stroke="#82b793"/>
  <text x="604" y="531" text-anchor="middle" class="small">2. Select eligible</text><text x="604" y="552" text-anchor="middle" class="small">unsettled entries</text>
  <rect x="689" y="505" width="125" height="66" rx="11" fill="#fff" stroke="#82b793"/>
  <text x="751" y="531" text-anchor="middle" class="small">3. Group by</text><text x="751" y="552" text-anchor="middle" class="small">merchant</text>
  <rect x="836" y="505" width="125" height="66" rx="11" fill="#fff" stroke="#82b793"/>
  <text x="898" y="531" text-anchor="middle" class="small">4. Snapshot +</text><text x="898" y="552" text-anchor="middle" class="small">settle positive</text>
  <path d="M520 538H540M667 538H687M814 538H834" class="line"/>

  <rect x="1095" y="190" width="250" height="105" rx="14" fill="#eef8f1" stroke="#82b793" filter="url(#shadow)"/>
  <text x="1220" y="226" text-anchor="middle" class="head">Merchant PSP</text>
  <text x="1220" y="251" text-anchor="middle" class="small">merchant account provider</text>
  <text x="1220" y="273" text-anchor="middle" class="small">payout status + confirmation</text>

  <rect x="1095" y="380" width="250" height="105" rx="14" fill="#f1eafe" stroke="#a286d9" filter="url(#shadow)"/>
  <text x="1220" y="416" text-anchor="middle" class="head">Tax authority</text>
  <text x="1220" y="441" text-anchor="middle" class="small">future filing + remittance</text>
  <text x="1220" y="463" text-anchor="middle" class="small">per country and period</text>

  <path d="M255 131H373" class="line"/><text x="314" y="119" text-anchor="middle" class="small">webhooks</text>
  <path d="M255 276H315Q340 276 375 218" class="line"/><text x="302" y="263" text-anchor="middle" class="small">reference data</text>
  <path d="M255 431H310Q340 431 375 225" class="future"/>
  <path d="M255 581H330Q355 581 375 565" class="line"/>
  <path d="M625 190H703" class="line"/>
  <path d="M570 240V268" class="line"/>
  <path d="M842 240V276Q842 300 812 310" class="line"/>
  <path d="M677 394V443" class="line"/>
  <path d="M980 538H1050Q1075 538 1095 290" class="line"/><text x="1080" y="343" text-anchor="middle" class="small">payout</text>
  <path d="M1095 255H1035Q1015 255 980 475" class="line"/><text x="1050" y="239" text-anchor="middle" class="small">status</text>
  <path d="M880 394Q1010 418 1093 430" class="future"/>

  <rect x="340" y="690" width="1005" height="155" rx="16" fill="#f5f6f7" stroke="#aab2bb"/>
  <text x="370" y="724" class="head">Balance decisions</text>
  <circle cx="390" cy="758" r="7" fill="#4c9766"/><text x="410" y="763" class="text">Positive balance → create one idempotent payout and atomically link its source entries.</text>
  <circle cx="390" cy="792" r="7" fill="#d7a93f"/><text x="410" y="797" class="text">Zero or negative balance → carry entries forward; alert after 14 negative days.</text>
  <circle cx="390" cy="826" r="7" fill="#3d7eb6"/><text x="410" y="831" class="text">Late historical payment → next eligible batch. Future-dated payment → wait. Over seven days → warning.</text>

  <line x1="45" y1="865" x2="90" y2="865" class="line"/><text x="100" y="870" class="small">implemented / core flow</text>
  <line x1="255" y1="865" x2="300" y2="865" class="future"/><text x="310" y="870" class="small">future integration</text>
</svg>
