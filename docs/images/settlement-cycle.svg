<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Settlement and operational cycle</title>
  <desc id="desc">Real-time ledger ingestion feeds daily merchant payout, negative balance review, monthly tax settlement and reconciliation.</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5965"/>
    </marker>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17212b" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #17212b; }
      .heading { font: 700 17px Inter, Arial, sans-serif; fill: #17212b; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #33404d; }
      .small { font: 13px Inter, Arial, sans-serif; fill: #526171; }
      .tag { font: 700 12px Inter, Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #4f5965; stroke-width: 2; fill: none; marker-end: url(#arrow3); }
      .dash { stroke: #7d8994; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow3); }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fbfaf7"/>
  <text x="50" y="52" class="title">Real-time ledger; asynchronous settlement</text>

  <rect x="50" y="91" width="250" height="118" rx="16" fill="#eaf3ff" stroke="#79aee0" filter="url(#shadow3)"/>
  <rect x="67" y="107" width="76" height="24" rx="12" fill="#3d7eb6"/>
  <text x="105" y="124" text-anchor="middle" class="tag">REAL TIME</text>
  <text x="175" y="156" text-anchor="middle" class="heading">PSP events</text>
  <text x="175" y="180" text-anchor="middle" class="small">capture + refund notifications</text>
  <path d="M300 150 H372" class="arrow"/>
  <rect x="374" y="80" width="300" height="140" rx="16" fill="#ffffff" stroke="#7d8994" filter="url(#shadow3)"/>
  <text x="524" y="119" text-anchor="middle" class="heading">Append-only ledger</text>
  <text x="524" y="146" text-anchor="middle" class="small">PSP · TAX · REVENUE</text>
  <text x="524" y="168" text-anchor="middle" class="small">MERCHANT · HELD</text>
  <text x="524" y="196" text-anchor="middle" class="small">atomic, balanced, idempotent</text>
  <path d="M674 150 H746" class="arrow"/>
  <rect x="748" y="91" width="402" height="118" rx="16" fill="#fff0ee" stroke="#df8b82" filter="url(#shadow3)"/>
  <text x="949" y="127" text-anchor="middle" class="heading">Daily PSP reconciliation</text>
  <text x="949" y="153" text-anchor="middle" class="small">compare captures, refunds and settlements</text>
  <text x="949" y="178" text-anchor="middle" class="small">missing/conflicting facts → alert + exception queue</text>

  <path d="M454 220 C430 264 310 263 272 300" class="arrow"/>
  <path d="M594 220 C620 264 805 263 842 300" class="arrow"/>

  <rect x="50" y="302" width="500" height="188" rx="18" fill="#eef8f1" stroke="#82b793"/>
  <rect x="72" y="320" width="62" height="24" rx="12" fill="#4c9766"/>
  <text x="103" y="337" text-anchor="middle" class="tag">DAILY</text>
  <text x="72" y="376" class="heading">Merchant payout cycle</text>
  <text x="72" y="406" class="text">1. Sum positive MERCHANT balance; exclude HELD</text>
  <text x="72" y="433" class="text">2. Create idempotent payout instruction</text>
  <text x="72" y="460" class="text">3. Transfer service reports SENT / CONFIRMED</text>

  <rect x="650" y="302" width="500" height="188" rx="18" fill="#fff5db" stroke="#d7a93f"/>
  <rect x="672" y="320" width="78" height="24" rx="12" fill="#bc8320"/>
  <text x="711" y="337" text-anchor="middle" class="tag">MONTHLY</text>
  <text x="672" y="376" class="heading">Tax settlement cycle</text>
  <text x="672" y="406" class="text">1. Sum TAX balance per country and period</text>
  <text x="672" y="433" class="text">2. Follow jurisdiction filing calendar</text>
  <text x="672" y="460" class="text">3. Pay idempotently; record confirmation</text>

  <path d="M302 490 V535" class="arrow"/>
  <rect x="50" y="537" width="500" height="78" rx="15" fill="#fff0ee" stroke="#df8b82"/>
  <text x="300" y="568" text-anchor="middle" class="heading">Negative merchant balance for 14 days</text>
  <text x="300" y="592" text-anchor="middle" class="small">alert → reserve / future sales / top-up / authorised recovery</text>

  <path d="M900 490 V535" class="arrow"/>
  <rect x="650" y="537" width="500" height="78" rx="15" fill="#f1eafe" stroke="#a286d9"/>
  <text x="900" y="568" text-anchor="middle" class="heading">Versioned tax rules</text>
  <text x="900" y="592" text-anchor="middle" class="small">tax service → validate/store → cache → freeze rate at capture</text>

  <path d="M650 576 C590 626 530 626 470 614" class="dash"/>
  <text x="600" y="637" text-anchor="middle" class="small">Planned background workflows; capture/refund posting stays synchronous</text>
</svg>
