name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Generated sources are intentionally ignored, so a clean CI checkout
      # must recreate them before Kotlin compilation.
      - name: Start code-generation database
        run: docker compose up -d --wait postgres

      - name: Apply database migrations
        run: ./scripts/db-migrate.sh

      - name: Generate sources and run tests
        run: ./gradlew apiCodegen jooqCodegen test --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop code-generation database
        if: always()
        run: docker compose down -v
