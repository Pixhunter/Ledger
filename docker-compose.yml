# Postgres only. The application itself runs natively - ./gradlew run, or the
# run button in IntelliJ - and applies its own migrations at startup.
#
# Postgres is in a container purely so the project needs no local install and
# the version is pinned. Point DB_URL at any Postgres you prefer instead.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ledger-postgres
    ports:
      - "3333:5432"
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ledger-pgdata:
