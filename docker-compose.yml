services:
  postgres:
    image: postgres:17-alpine
    container_name: ledger-postgres
    ports:
      - "3333:5432"
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: ledger:local
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      DB_USER: ledger
      DB_PASSWORD: ledger
      SERVER_PUBLIC_URL: http://localhost:8081
      PSP_SECRET: dev-psp-secret-change-me
      PSP_ALLOW_SECRET_HEADER: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ledger-pgdata:
