# Single source of truth for host, port, database and business constants.

server:
  host: 0.0.0.0        # SERVER_HOST
  port: 8081           # SERVER_PORT
  publicUrl:           # SERVER_PUBLIC_URL

database:
  url: jdbc:postgresql://localhost:3333/ledger   # DB_URL
  user: ledger                                   # DB_USER
  password: ledger                               # DB_PASSWORD
  poolSize: 10                                   # DB_POOL_SIZE

mor:
  # Country of establishment. Decides domestic vs cross-border B2B, so it
  # decides whether reverse charge applies.
  country: DE          # MOR_COUNTRY
  # Flat fee on the gross, basis points. 500 = 5.00%.
  feeBasisPoints: 500  # MOR_FEE_BP
  # Merchants inserted or refreshed at startup. Blank in production: merchants
  # come from the onboarding service, not from a file in the jar.
  merchantSeedResource: merchants.json

psp:
  # HMAC-SHA256 secret for webhook signatures. Local development value - the
  # real one comes from PSP_SECRET and is never committed. Blank rejects every
  # request: the endpoint fails closed.
  secret: dev-psp-secret-change-me   # PSP_SECRET
  # Swagger cannot sign the body it is about to send, so locally the header
  # may be the secret itself. No header is still 401. Never true in production.
  allowSecretHeader: true            # PSP_ALLOW_SECRET_HEADER
